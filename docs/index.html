<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLICKI - Offline Media & Music Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #050505;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 0, 51, 0.15);
      border: 1px solid #FF0033;
      color: #FF4D6D;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #FFFFFF 30%, #FF0033 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #8E8E93;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .footer {
      margin-top: 40px;
      color: #48484A;
      font-size: 13px;
    }
    .footer a {
      color: #8E8E93;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Official App Portal</div>
    <h1>CLICKI</h1>
    <p>Offline High-Definition Audio & Video Media Player for Android with smart background playback, multi-speed controls, and batch playlist management.</p>
    <div class="footer">
      &copy; 2026 CLICKI. All rights reserved. • <a href="app-ads.txt">app-ads.txt</a>
    </div>
  </div>
</body>
</html>
